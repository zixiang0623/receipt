<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>レシート発行</title>
<!-- ★ Fix: history.scrollRestorationをmanualに — ブラウザのスクロール復元を完全無効化 -->
<script>
  if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #f5f5f7;
  --surface: #ffffff;
  --border:  #e8e8ed;
  --border2: #f0f0f5;
  --ink:     #1d1d1f;
  --ink2:    #3a3a3c;
  --muted:   #98989d;
  --accent:  #0066ff;
  --red:     #ff3b30;
  --radius-sm: 10px;
  --radius:    16px;
  --radius-lg: 22px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.14), 0 4px 12px rgba(0,0,0,0.08);
}

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans JP', -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* iOSでinputのauto-zoomを防ぐ (font-size >= 16px) */
input, select, textarea {
  font-size: 16px !important;
}

/* number spinnerを非表示 */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type=number] { -moz-appearance: textfield; }

/* ━━━━ ナビ ━━━━ */
.nav {
  position: sticky; top: 0; z-index: 50;
  height: 54px;
  background: rgba(245,245,247,0.88);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
}

.nav-icon {
  width: 30px; height: 30px; background: var(--ink);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.nav-icon svg { width: 15px; height: 15px; }

.nav-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.nav-date {
  margin-left: auto;
  font-family: 'Geist Mono', monospace;
  font-size: 11px; color: var(--muted); font-weight: 300;
}

/* ━━━━ ページ ━━━━ */
.page {
  max-width: 640px; margin: 0 auto;
  padding: 24px 16px 110px;
}

/* ━━━━ セクションヘッダ ━━━━ */
.sec-head {
  display: flex; align-items: center; gap: 8px;
  margin: 28px 0 10px;
}
.sec-head:first-child { margin-top: 0; }

.sec-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}
.sec-label {
  font-size: 11px; font-weight: 500;
  letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--muted); font-family: 'Geist Mono', monospace;
}
.sec-hint {
  font-family: 'Geist Mono', monospace;
  font-size: 10px; color: var(--muted); margin-left: auto;
}

/* ━━━━ カード ━━━━ */
.card {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden;
}

.field {
  display: flex; align-items: center;
  padding: 0 18px; min-height: 52px;
  border-bottom: 1px solid var(--border2); gap: 12px;
  transition: background 0.12s;
}
.field:last-child { border-bottom: none; }
.field:focus-within { background: #fafbff; }

.field-lbl { font-size: 15px; color: var(--ink2); min-width: 64px; flex-shrink: 0; }

.field-inp {
  flex: 1; border: none; outline: none;
  color: var(--ink); font-family: 'Noto Sans JP', sans-serif;
  background: transparent; text-align: right; min-width: 0;
}
.field-inp::placeholder { color: #c8c8cf; }

/* ━━━━ 商品テーブル ━━━━ */
.items-wrap {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden;
}

.col-labels {
  display: grid; grid-template-columns: 1fr 64px 108px 44px;
  padding: 9px 12px 9px 18px; border-bottom: 1px solid var(--border2);
  font-family: 'Geist Mono', monospace;
  font-size: 10px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase;
}
.col-labels span:nth-child(2) { text-align: center; }
.col-labels span:nth-child(3) { text-align: right; padding-right: 8px; }

.item-row {
  display: grid; grid-template-columns: 1fr 64px 108px 44px;
  align-items: stretch; border-bottom: 1px solid var(--border2);
  transition: background 0.1s;
  animation: rowIn 0.2s cubic-bezier(0.34, 1.5, 0.64, 1);
}
@keyframes rowIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: none; }
}
.item-row:focus-within { background: #fafbff; }

.i-name {
  border: none; outline: none;
  font-family: 'Noto Sans JP', sans-serif; color: var(--ink);
  background: transparent; padding: 0 8px 0 18px;
  width: 100%; height: 52px;
}
.i-name::placeholder { color: #c8c8cf; }

.i-tax-cell {
  border-left: 1px solid var(--border2); border-right: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
}
.i-tax {
  border: none; outline: none; background: transparent;
  font-family: 'Geist Mono', monospace; color: var(--ink2); cursor: pointer;
  width: 100%; height: 52px; text-align: center;
  -webkit-appearance: none; appearance: none;
}

.i-price-cell {
  display: flex; align-items: center;
  padding: 0 8px 0 6px; gap: 1px;
}
.i-price-pre { font-size: 12px; color: var(--muted); font-family: 'Geist Mono', monospace; flex-shrink: 0; }

.i-price {
  border: none; outline: none;
  font-family: 'Geist Mono', monospace; color: var(--ink);
  background: transparent; width: 100%; height: 52px;
  text-align: right; padding: 0;
}
.i-price::placeholder { color: #c8c8cf; }

.i-del {
  border: none; border-left: 1px solid var(--border2);
  background: none; color: #d0d0d5; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  height: 52px; min-width: 44px;
  transition: color 0.12s, background 0.12s;
}
.i-del:hover { color: var(--red); background: #fff5f5; }

.tax-badge {
  font-size: 10px; color: #bbb; font-family: 'Geist Mono', monospace;
  text-align: right; padding: 3px 52px 5px 0;
  border-bottom: 1px solid var(--border2); min-height: 1px;
}

.add-row {
  display: flex; align-items: center;
  padding: 0 18px; height: 52px; gap: 10px; cursor: pointer;
  color: var(--accent); font-size: 15px; font-weight: 500;
  border-top: 1px solid var(--border2);
  transition: background 0.1s; user-select: none;
}
.add-row:hover  { background: #f0f5ff; }
.add-row:active { background: #e5eeff; }

.add-icon {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: white;
  font-size: 18px; font-weight: 300; padding-bottom: 1px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* ━━━━ 備考 ━━━━ */
.note-wrap {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  padding: 14px 18px; transition: background 0.1s;
}
.note-wrap:focus-within { background: #fafbff; }

.note-inp {
  width: 100%; border: none; outline: none;
  font-family: 'Noto Sans JP', sans-serif; color: var(--ink);
  background: transparent; resize: none; line-height: 1.7;
}
.note-inp::placeholder { color: #c8c8cf; }

/* ━━━━ 発行ボタン（固定） ━━━━ */
.issue-dock {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: rgba(245,245,247,0.9);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--border);
  display: flex; justify-content: center;
}

.issue-btn {
  width: 100%; max-width: 640px; height: 56px;
  background: var(--ink); color: white; border: none;
  border-radius: var(--radius); font-size: 17px; font-weight: 600;
  font-family: 'Noto Sans JP', sans-serif; letter-spacing: 0.2px; cursor: pointer;
  box-shadow: 0 4px 18px rgba(0,0,0,0.22);
  transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.issue-btn:hover  { background: #2a2a2a; box-shadow: 0 8px 28px rgba(0,0,0,0.26); transform: translateY(-1px); }
.issue-btn:active { transform: none; box-shadow: 0 2px 8px rgba(0,0,0,0.18); }

/* ━━━━ モーダル ━━━━ */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  display: none; align-items: flex-end; justify-content: center;
}
.overlay.open { display: flex; }

.overlay-bg {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0);
  backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
  transition: background 0.4s, backdrop-filter 0.4s, -webkit-backdrop-filter 0.4s;
  cursor: pointer;
}
.overlay.open .overlay-bg {
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}

.modal {
  position: relative; z-index: 1;
  width: 100%; max-width: 430px;
  max-height: 92dvh; max-height: 92vh;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.52s cubic-bezier(0.16, 1, 0.3, 1);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  overflow: hidden; box-shadow: var(--shadow-lg);
}
.overlay.open .modal { transform: translateY(0); }

.drag-handle {
  height: 26px; background: white;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.drag-handle div {
  width: 36px; height: 4px; border-radius: 2px; background: #e0e0e5;
}

.modal-scroll {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  background: #f0ede6;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 16px 20px;
}
.modal-scroll::-webkit-scrollbar { display: none; }

.receipt-paper {
  width: 100%; max-width: 310px; background: white;
  box-shadow: 0 2px 20px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
}

.perf { height: 14px; background-repeat: repeat-x; background-size: 14px 14px; }
.perf-top    { background-image: radial-gradient(circle at 7px 14px, #f0ede6 7px, white 7px); }
.perf-bottom { background-image: radial-gradient(circle at 7px 0,  #f0ede6 7px, white 7px); }

.receipt-inner {
  padding: 4px 22px 18px;
  font-family: 'Geist Mono', monospace;
  font-size: 11.5px; color: var(--ink); line-height: 1.9;
}

.r-shop { text-align: center; padding: 10px 0 12px; }
.r-shop-name {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 17px; font-weight: 700; letter-spacing: 5px; display: block;
}
.r-shop-sub {
  font-size: 9px; color: #aaa; letter-spacing: 0.5px; display: block; margin-top: 2px;
  font-family: 'Noto Sans JP', sans-serif;
}
.r-hr { border: none; border-top: 1px dashed #ddd; margin: 8px 0; }
.r-meta { display: flex; justify-content: space-between; font-size: 9px; color: #aaa; margin-bottom: 1px; }

.r-item { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; gap: 8px; }
.r-item-n { flex: 1; word-break: break-all; font-size: 12px; }
.r-item-p { white-space: nowrap; font-size: 12px; }
.r-item-tax { font-size: 9px; color: #bbb; text-align: right; margin-bottom: 2px; }

.r-sub-row { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; padding: 0.5px 0; }

.r-grand {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 19px;
  letter-spacing: -0.5px; border-top: 1.5px solid var(--ink); padding-top: 8px; margin-top: 4px;
}
.r-note { font-size: 10px; color: #aaa; white-space: pre-wrap; text-align: center; font-family: 'Noto Sans JP', sans-serif; line-height: 1.8; }
.r-thanks { text-align: center; font-size: 9px; color: #ccc; letter-spacing: 4px; margin-top: 14px; font-family: 'Noto Sans JP', sans-serif; }

/* ━━━━ アクションバー ━━━━ */
.modal-action {
  flex-shrink: 0;
  padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
  background: white; border-top: 1px solid var(--border); display: flex; gap: 10px;
}
.m-btn {
  border: none; border-radius: var(--radius-sm);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px; font-weight: 600; cursor: pointer; height: 52px; min-height: 44px;
  transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.m-btn-dl {
  flex: 1; background: var(--ink); color: white; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
}
.m-btn-dl:hover { background: #2a2a2a; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.22); }
.m-btn-dl:active { transform: none; }
.m-btn-close {
  flex: 0 0 52px; background: var(--bg); color: var(--ink2);
  border: 1px solid var(--border); font-size: 17px; font-weight: 400;
}
.m-btn-close:hover { background: #ebebf0; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-icon">
    <svg viewBox="0 0 15 15" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round">
      <path d="M2.5 3.5h10M2.5 6h10M2.5 8.5h6M2.5 11h4"/>
    </svg>
  </div>
  <span class="nav-title">レシート発行</span>
  <span class="nav-date" id="clock"></span>
</nav>

<main class="page">

  <div class="sec-head">
    <div class="sec-dot"></div>
    <span class="sec-label">店舗情報</span>
  </div>
  <div class="card">
    <div class="field">
      <span class="field-lbl">店舗名</span>
      <input class="field-inp" id="storeName" type="text" placeholder="例：NOVA STORE" autocomplete="organization">
    </div>
    <div class="field">
      <span class="field-lbl">住所</span>
      <input class="field-inp" id="storeAddr" type="text" placeholder="例：東京都渋谷区〇〇 1-1-1" autocomplete="street-address">
    </div>
    <div class="field">
      <span class="field-lbl">TEL</span>
      <input class="field-inp" id="storeTel" type="tel" placeholder="03-XXXX-XXXX" inputmode="tel" autocomplete="tel">
    </div>
    <div class="field">
      <span class="field-lbl">担当者</span>
      <input class="field-inp" id="staffName" type="text" placeholder="例：山田 太郎" autocomplete="name">
    </div>
  </div>

  <div class="sec-head">
    <div class="sec-dot"></div>
    <span class="sec-label">商品明細</span>
    <span class="sec-hint">税抜価格を入力</span>
  </div>
  <div class="items-wrap">
    <div class="col-labels">
      <span>商品名</span><span>税率</span><span>税抜価格</span><span></span>
    </div>
    <div id="itemList"></div>
    <div class="add-row" onclick="addItem()">
      <div class="add-icon">+</div>商品を追加
    </div>
  </div>

  <div class="sec-head">
    <div class="sec-dot"></div>
    <span class="sec-label">備考</span>
  </div>
  <div class="note-wrap">
    <textarea class="note-inp" id="note" rows="2" placeholder="例：ご利用ありがとうございました。"></textarea>
  </div>

</main>

<div class="issue-dock">
  <button class="issue-btn" onclick="issue()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="1" width="12" height="14" rx="1.5"/><path d="M5 5h6M5 8h6M5 11h3"/>
    </svg>
    レシートを発行する
  </button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-bg" onclick="closeModal()"></div>
  <div class="modal">
    <div class="drag-handle"><div></div></div>
    <div class="modal-scroll" id="modalScroll">
      <div class="receipt-paper" id="receiptPaper">
        <div class="perf perf-top"></div>
        <div class="receipt-inner" id="receiptInner"></div>
        <div class="perf perf-bottom"></div>
      </div>
    </div>
    <div class="modal-action">
      <button class="m-btn m-btn-dl" onclick="dlReceipt(event)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 1v8M4 6l3 3 3-3"/><path d="M2 12h10"/>
        </svg>
        画像でダウンロード
      </button>
      <button class="m-btn m-btn-close" onclick="closeModal()">✕</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// ★★★ スクロール先頭固定 — 5回テスト済み完全対策版 ★★★
//
// 根本原因: addItem() 内の setTimeout(focus, 60ms) が
//   window.load の scrollTo(top:0) より後に発火し、
//   focusによるブラウザ自動スクロールが top:0 を上書きしていた。
//
// 対策:
//   1. history.scrollRestoration = 'manual'  (<head>内で既に設定)
//   2. isInitialLoad フラグで初期addItemのfocusを完全スキップ
//   3. DOMContentLoaded / load / pageshow の3箇所でscrollToTop
//   4. focus({ preventScroll: true }) でfocus自体のスクロールも抑制
// ============================================================

let isInitialLoad = true; // ★ フラグ: trueの間はaddItemがfocusしない

function forceScrollTop() {
  window.scrollTo({ top: 0, behavior: 'instant' });
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
}

// ★ DOMContentLoaded でも実行
document.addEventListener('DOMContentLoaded', forceScrollTop);

// ★ window.load でも実行
window.addEventListener('load', () => {
  forceScrollTop();
  // loadから150ms後にフラグ解除（addItemのsetTimeoutが全て終わった後）
  setTimeout(() => { isInitialLoad = false; }, 150);
});

// ★ bfcache（戻るボタン）対応
window.addEventListener('pageshow', (e) => {
  if (e.persisted) forceScrollTop(); // bfcacheから復元された場合
});

/* ─── 時計 ─── */
function tick() {
  const n = new Date(), p = v => String(v).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${n.getFullYear()}/${p(n.getMonth()+1)}/${p(n.getDate())}  ${p(n.getHours())}:${p(n.getMinutes())}`;
}
setInterval(tick, 20000); tick();

/* ─── 商品管理 ─── */
let items = [], seq = 0;

function addItem(name='', price='', tax=10) {
  const id = ++seq;
  items.push({ id, name, price, tax });
  appendItemRow({ id, name, price, tax });
  setTimeout(() => {
    const el = document.getElementById(`item-name-${id}`);
    if (!el) return;
    if (isInitialLoad) {
      // ★ 初期ロード中はfocusしない（スクロールの原因になるため）
      return;
    }
    // ★ preventScroll:true でfocusしてもスクロールさせない（iOS15.4+対応）
    try {
      el.focus({ preventScroll: true });
    } catch {
      el.focus();
    }
  }, 60);
}

function appendItemRow(it) {
  const list = document.getElementById('itemList');

  const row = document.createElement('div');
  row.className = 'item-row';
  row.id = `item-row-${it.id}`;
  row.innerHTML = `
    <input id="item-name-${it.id}" class="i-name" type="text"
      placeholder="商品名" value="${esc(it.name)}"
      oninput="updName(${it.id},this.value)"
      autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="i-tax-cell">
      <select id="item-tax-${it.id}" class="i-tax"
        onchange="updTax(${it.id},+this.value)">
        <option value="10" ${it.tax===10?'selected':''}>10%</option>
        <option value="8"  ${it.tax===8 ?'selected':''}>8%</option>
        <option value="0"  ${it.tax===0 ?'selected':''}>非課税</option>
      </select>
    </div>
    <div class="i-price-cell">
      <span class="i-price-pre">¥</span>
      <input id="item-price-${it.id}" class="i-price" type="number"
        placeholder="0" min="0" inputmode="numeric"
        value="${it.price||''}"
        oninput="updPrice(${it.id},this.value)"
        autocomplete="off">
    </div>
    <button class="i-del" onclick="removeItem(${it.id})" aria-label="削除">×</button>
  `;

  const badge = document.createElement('div');
  badge.className = 'tax-badge';
  badge.id = `item-badge-${it.id}`;

  list.appendChild(row);
  list.appendChild(badge);
}

function updName(id, val) {
  const item = items.find(i => i.id === id); if (item) item.name = val;
}

function updPrice(id, val) {
  const item = items.find(i => i.id === id); if (!item) return;
  item.price = val === '' ? '' : +val;
  updateBadge(id);
}

function updTax(id, val) {
  const item = items.find(i => i.id === id); if (!item) return;
  item.tax = val; updateBadge(id);
}

function updateBadge(id) {
  const item = items.find(i => i.id === id);
  const badge = document.getElementById(`item-badge-${id}`);
  if (!item || !badge) return;
  if (item.price && +item.price > 0 && item.tax > 0) {
    badge.textContent = `税込 ¥${Math.round(+item.price * (1 + item.tax/100)).toLocaleString()}`;
  } else {
    badge.textContent = '';
  }
}

function removeItem(id) {
  items = items.filter(i => i.id !== id);
  document.getElementById(`item-row-${id}`)?.remove();
  document.getElementById(`item-badge-${id}`)?.remove();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 初期商品3行（isInitialLoad=trueの間は自動focusしない） */
addItem(); addItem(); addItem();

/* ─── 発行 ─── */
function issue() {
  const p = v => String(v).padStart(2,'0');

  items.forEach(it => {
    const ne = document.getElementById(`item-name-${it.id}`);
    const pe = document.getElementById(`item-price-${it.id}`);
    const te = document.getElementById(`item-tax-${it.id}`);
    if (ne) it.name  = ne.value;
    if (pe) it.price = pe.value === '' ? '' : +pe.value;
    if (te) it.tax   = +te.value;
  });

  const storeName = document.getElementById('storeName').value.trim() || '店舗名';
  const storeAddr = document.getElementById('storeAddr').value.trim();
  const storeTel  = document.getElementById('storeTel').value.trim();
  const staffName = document.getElementById('staffName').value.trim();
  const note      = document.getElementById('note').value.trim();

  const valid = items.filter(i => i.name && +i.price > 0);
  const now   = new Date();
  const dateStr = `${now.getFullYear()}/${p(now.getMonth()+1)}/${p(now.getDate())}`;
  const timeStr = `${p(now.getHours())}:${p(now.getMinutes())}`;
  const no = 'R' + String(Math.floor(Math.random()*900000)+100000);

  let ex10=0, ex8=0, ex0=0;
  valid.forEach(i => {
    if      (i.tax===10) ex10 += +i.price;
    else if (i.tax===8)  ex8  += +i.price;
    else                 ex0  += +i.price;
  });
  const tax10 = Math.round(ex10 * 0.10);
  const tax8  = Math.round(ex8  * 0.08);
  const grand = ex10 + tax10 + ex8 + tax8 + ex0;

  const itemsHtml = valid.length
    ? valid.map(i => {
        const ex = +i.price;
        const incl = i.tax > 0 ? Math.round(ex * (1 + i.tax/100)) : ex;
        return `
          <div class="r-item">
            <span class="r-item-n">${esc(i.name)}</span>
            <span class="r-item-p">¥${incl.toLocaleString()}</span>
          </div>
          <div class="r-item-tax">${i.tax > 0 ? `税抜 ¥${ex.toLocaleString()} + ${i.tax}%` : '非課税'}</div>`;
      }).join('')
    : `<div class="r-item" style="color:#ccc;">（商品なし）</div>`;

  const taxDetailHtml = [
    ex10 > 0 ? `
      <div class="r-sub-row"><span>10%対象（税抜）</span><span>¥${ex10.toLocaleString()}</span></div>
      <div class="r-sub-row"><span>　うち消費税10%</span><span>¥${tax10.toLocaleString()}</span></div>` : '',
    ex8  > 0 ? `
      <div class="r-sub-row"><span>8%対象（税抜）</span><span>¥${ex8.toLocaleString()}</span></div>
      <div class="r-sub-row"><span>　うち消費税8%</span><span>¥${tax8.toLocaleString()}</span></div>` : '',
  ].filter(Boolean).join('');

  document.getElementById('receiptInner').innerHTML = `
    <div class="r-shop">
      <span class="r-shop-name">${esc(storeName)}</span>
      ${storeAddr ? `<span class="r-shop-sub">${esc(storeAddr)}</span>` : ''}
      ${storeTel  ? `<span class="r-shop-sub">TEL ${esc(storeTel)}</span>` : ''}
    </div>
    <hr class="r-hr">
    <div class="r-meta">
      <span>${dateStr}　${timeStr}</span>
      <span>${no}</span>
    </div>
    ${staffName ? `<div class="r-meta"><span>担当：${esc(staffName)}</span></div>` : ''}
    <hr class="r-hr">
    ${itemsHtml}
    <hr class="r-hr">
    ${taxDetailHtml}
    <div class="r-grand"><span>合　計</span><span>¥${grand.toLocaleString()}</span></div>
    ${note ? `<hr class="r-hr"><div class="r-note">${esc(note)}</div>` : ''}
    <div class="r-thanks">ありがとうございました</div>
  `;

  const ov = document.getElementById('overlay');
  ov.style.display = 'flex'; ov.offsetHeight; ov.classList.add('open');
  document.getElementById('modalScroll').scrollTop = 0;
}

function closeModal() {
  const ov = document.getElementById('overlay');
  ov.classList.remove('open');
  setTimeout(() => { ov.style.display = 'none'; }, 540);
}

async function dlReceipt(e) {
  const btn = e.currentTarget;
  const orig = btn.innerHTML;
  btn.innerHTML = '生成中…'; btn.disabled = true;

  try {
    const canvas = await html2canvas(document.getElementById('receiptPaper'), {
      scale: 3,
      backgroundColor: '#ffffff',
      useCORS: true,
      allowTaint: true,
      logging: false,
    });
    const dataURL = canvas.toDataURL('image/png');

    // iOS Safari 判定（download属性が無視されるため別処理）
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      // スタンドアロンモード（ホーム画面追加）ではwindow.open/closeが使えない
      const isStandalone = window.navigator.standalone === true;
      if (isStandalone) {
        showImagePreview(dataURL);
        btn.innerHTML = orig; btn.disabled = false;
        return;
      }
      // 通常Safari → 新しいタブで開く
      const win = window.open('', '_blank');
      if (win) {
        win.document.write(`
          <html><head><title>レシート</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
            *{box-sizing:border-box;margin:0;padding:0;}
            body{background:#f0ede6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;font-family:sans-serif;gap:16px;}
            .top-bar{width:100%;max-width:400px;display:flex;justify-content:flex-start;}
            .back-btn{background:white;border:none;border-radius:12px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;color:#1d1d1f;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;gap:6px;}
            img{max-width:100%;max-width:400px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.2);}
            p{color:#888;font-size:13px;text-align:center;line-height:1.7;}
          </style>
          </head><body>
          <div class="top-bar">
            <button class="back-btn" onclick="window.close()">← 戻る</button>
          </div>
          <img src="${dataURL}" alt="レシート">
          <p>画像を長押しして「写真に保存」または<br>「画像を保存」を選んでください</p>
          </body></html>
        `);
        win.document.close();
      } else {
        // ポップアップブロックされた場合：ページ内プレビュー表示
        showImagePreview(dataURL);
      }
    } else {
      // PC / Android: anchor click でダウンロード
      const a = document.createElement('a');
      a.download = `receipt_${Date.now()}.png`;
      a.href = dataURL;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  } catch(err) {
    console.error(err);
    alert('生成に失敗しました。再度お試しください。');
  }

  btn.innerHTML = orig;
  btn.disabled = false;
}

// iOSポップアップブロック時のフォールバック：ページ内で画像プレビュー表示
function showImagePreview(dataURL) {
  // 既存のプレビューがあれば削除
  document.getElementById('img-preview-overlay')?.remove();

  const overlay = document.createElement('div');
  overlay.id = 'img-preview-overlay';
  overlay.style.cssText = `
    position:fixed;inset:0;z-index:300;
    background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;gap:16px;
  `;

  const img = document.createElement('img');
  img.src = dataURL;
  img.style.cssText = 'max-width:100%;max-height:70vh;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.4);';

  const msg = document.createElement('p');
  msg.textContent = '画像を長押しして「写真に保存」を選んでください';
  msg.style.cssText = 'color:#fff;font-size:14px;text-align:center;line-height:1.7;margin:0;font-family:sans-serif;';

  const closeBtn = document.createElement('button');
  closeBtn.textContent = '閉じる';
  closeBtn.style.cssText = `
    background:white;color:#1d1d1f;border:none;border-radius:12px;
    padding:12px 32px;font-size:15px;font-weight:600;cursor:pointer;
    font-family:sans-serif;
  `;
  closeBtn.onclick = () => overlay.remove();

  overlay.appendChild(img);
  overlay.appendChild(msg);
  overlay.appendChild(closeBtn);
  overlay.onclick = (ev) => { if (ev.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}
</script>
